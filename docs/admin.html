<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>لوحة المشرف | THIRD PILLAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="css/admin.css?v=3">
</head>
<body class="admin">

<header class="topbar">
  <div class="brand-box sm"><b>THIRD PILLAR</b><span>returning favours bestowed upon us</span></div>
  <h1>لوحة المشرف — سجلات الأيتام</h1>
  <button id="logoutBtn" class="btn ghost sm" hidden>تسجيل الخروج</button>
</header>

<main>
  <!-- تسجيل الدخول -->
  <section id="loginView" class="card login" hidden>
    <h2>تسجيل دخول المشرف</h2>
    <form id="loginForm">
      <label>البريد الإلكتروني<input type="email" name="email" required autocomplete="username" dir="ltr"></label>
      <label>كلمة المرور<input type="password" name="password" required autocomplete="current-password" dir="ltr"></label>
      <button class="btn" type="submit">دخول</button>
      <p id="loginMsg" class="msg err" role="alert"></p>
    </form>
  </section>

  <!-- القائمة -->
  <section id="listView" hidden>
    <div class="toolbar">
      <input id="search" type="search" placeholder="بحث بالاسم أو الرقم التعريفي أو اسم الأم…">
      <span id="count" class="count"></span>
      <a class="btn ghost sm" href="index.html" target="_blank" rel="noopener">+ تسجيل جديد</a>
      <button id="exportBtn" class="btn sm">تصدير Excel (CSV)</button>
    </div>
    <div class="card table-card">
      <table class="list">
        <thead><tr>
          <th>الرقم التعريفي</th><th>الاسم الكامل</th><th>الجنس</th><th>العمر</th>
          <th>اسم الأم</th><th>الهاتف</th><th>تاريخ التسجيل</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="listMsg" class="msg"></p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=3"></script>
<script src="js/admin.js?v=3"></script>
</body>
</html>
