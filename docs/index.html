<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>نظام تسجيل الأيتام | THIRD PILLAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=21">
</head>
<body>

<div id="boot" class="boot">جارِ التحميل…</div>

<!-- ============ تسجيل الدخول ============ -->
<section id="loginView" class="login" hidden>
  <div class="login-card">
    <div class="brand-box"><b>THIRD PILLAR</b><span>returning favours bestowed upon us</span></div>
    <h1>نظام تسجيل بيانات الأيتام</h1>
    <p class="sub">مؤسسة الركيزة الثالثة</p>
    <form id="loginForm" novalidate>
      <label>اسم المستخدم أو البريد الإلكتروني
        <input type="text" name="email" required autocomplete="username" dir="ltr" autocapitalize="none" spellcheck="false">
      </label>
      <label>كلمة المرور
        <input type="password" name="password" required autocomplete="current-password" dir="ltr">
      </label>
      <button class="btn block" type="submit">تسجيل الدخول</button>
      <p id="loginMsg" class="msg err" role="alert"></p>
    </form>
  </div>
</section>

<!-- ============ التطبيق ============ -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="side-brand">
      <div class="brand-box sm"><b>THIRD PILLAR</b><span>returning favours bestowed upon us</span></div>
    </div>
    <nav id="nav" class="nav">
      <a href="#/" data-route="home"><svg><use href="#i-home"/></svg><span>الرئيسية</span></a>
      <a href="#/register" data-route="register"><svg><use href="#i-plus"/></svg><span>تسجيل يتيم</span></a>
      <a href="#/records" data-route="records"><svg><use href="#i-list"/></svg><span>السجلات</span></a>
      <a href="#/photos" data-route="photos" data-admin><svg><use href="#i-img"/></svg><span>رفع صور</span></a>
      <a href="#/users" data-route="users" data-admin><svg><use href="#i-users"/></svg><span>المستخدمون</span></a>
    </nav>
    <div class="side-user">
      <div class="who"><b id="meName"></b><small id="meRole"></small></div>
      <div class="acts"><button id="pwBtn" class="btn ghost sm" type="button" title="تغيير كلمة المرور">🔑</button><button id="logoutBtn" class="btn ghost sm" type="button">خروج</button></div>
    </div>
  </aside>
  <main id="view" class="main"></main>
</div>

<dialog id="pwDialog" class="dlg">
  <form id="pwForm" novalidate>
    <h3>تغيير كلمة المرور</h3>
    <label>كلمة المرور الحالية<input type="password" name="cur" dir="ltr" required autocomplete="current-password"></label>
    <label>كلمة المرور الجديدة (8 أحرف فأكثر)<input type="password" name="new1" dir="ltr" required minlength="8" autocomplete="new-password"></label>
    <label>تأكيد كلمة المرور الجديدة<input type="password" name="new2" dir="ltr" required autocomplete="new-password"></label>
    <p id="pwMsg" class="msg err" role="alert"></p>
    <div class="btns"><button type="button" class="btn ghost" id="pwCancel">إلغاء</button><button type="submit" class="btn">حفظ</button></div>
  </form>
</dialog>

<dialog id="scanDialog" class="dlg">
  <h3>مسح رمز QR</h3>
  <video id="scanVideo" playsinline muted style="width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover"></video>
  <p id="scanMsg" class="msg"></p>
  <div class="btns"><button type="button" class="btn ghost" id="scanClose">إغلاق</button></div>
</dialog>

<div id="toast" class="toast" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><path d="M4 5h16v14H4zm2 2v10h12V7zm2 8 2.5-3.5 2 2.5 1.5-2L16 15zM9 9.5a1.2 1.2 0 1 1 0 .1z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.6 3.1-6 7-6s7 2.4 7 6zM17 11a3 3 0 1 0 0-6 4 4 0 0 1 0 6zm1 2.2c2.4.6 4 2.3 4 4.8h-4c0-1.8-.4-3.4-1.3-4.7z"/></symbol>
</svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=21"></script>
<script src="js/main.js?v=21"></script>
</body>
</html>
